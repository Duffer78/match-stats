<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Match Stats</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--acc:#15803d;--acc2:#dcfce7;--opp:#b91c1c;--opp2:#fee2e2;--draw:#92400e;--draw2:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.sync{font-size:12px;opacity:.85}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
nav button span{font-size:11px;font-weight:700}
nav button.on{color:var(--acc)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;background:var(--line);color:var(--ink);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.danger{background:var(--opp2);color:var(--opp)}
.btn.block{width:100%;display:block}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.big{padding:18px;font-size:18px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
h2{font-size:18px;margin:2px 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.tap{cursor:pointer}
.num{min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.score{display:flex;align-items:center;gap:6px;text-align:center}
.score .side{flex:1;min-width:0}
.score .tn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goals{font-size:48px;font-weight:900;border:0;background:var(--acc2);color:var(--acc);width:100%;border-radius:14px;padding:4px 0;margin-top:4px;cursor:pointer;font-family:inherit}
.goals.opp{background:var(--opp2);color:var(--opp)}
.clock{font-size:30px;font-variant-numeric:tabular-nums;font-weight:800;min-width:100px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--line);font-size:12px;font-weight:800}
.chip.W{background:var(--acc2);color:var(--acc)}
.chip.L{background:var(--opp2);color:var(--opp)}
.chip.D{background:var(--draw2);color:var(--draw)}
.chip.live{background:#dbeafe;color:#1d4ed8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;min-height:92px;cursor:pointer;font:inherit;color:inherit}
.tile:active{border-color:var(--acc)}
.tile .n{font-size:22px;font-weight:900;line-height:1.1}
.tile .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .bd{font-size:12px;min-height:15px}
.tile.bench{background:#f8fafc;border-style:dashed}
.tile.sel{border-color:var(--acc);background:var(--acc2)}
.sheetWrap{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statgrid .btn{padding:16px 6px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:30;font-weight:700;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:#86efac;font-weight:800;font-size:15px;padding:0}
.tablewrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
th.on{color:var(--acc)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.s{background:var(--acc);color:#fff}
.seg button.on.o{background:#94a3b8;color:#fff}
.ev{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ev .t{font-weight:800;min-width:36px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{border:0;background:var(--line);border-radius:8px;width:34px;height:34px;font-size:15px;color:var(--muted);cursor:pointer;flex-shrink:0}
.banner{background:#fef3c7;color:#78350f;padding:10px 14px;font-size:14px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat-row b{display:block;font-size:22px}
.stat-row span{font-size:12px;color:var(--muted);font-weight:700}
.check{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px}
.empty{text-align:center;padding:26px 10px}
.empty .big{font-size:40px}
ol.steps{padding-left:22px;margin:6px 0}
ol.steps li{margin-bottom:12px;line-height:1.4}
code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<header><div class="brand"><span>⚽</span><span id="teamName">Match Stats</span></div><span id="sync" class="sync"></span></header>
<div id="banner" class="banner hidden"></div>
<main id="view"></main>
<nav id="nav">
  <button data-act="tab" data-tab="matches">⚽<span>Matches</span></button>
  <button data-act="tab" data-tab="squad">👥<span>Squad</span></button>
  <button data-act="tab" data-tab="stats">📊<span>Season</span></button>
  <button data-act="tab" data-tab="settings">⚙️<span>Settings</span></button>
</nav>
<div id="sheetWrap" class="sheetWrap hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const APP_VERSION='1.0';
const KEY='grassroots-stats:v1';
const CFG_KEY='grassroots-stats:firebase';
const PRE_KEY='grassroots-stats:pre-connect';
const FB_VER='10.12.2';
const STAT_DEFS=[
  {k:'goal',label:'Goal',icon:'⚽',col:'G'},
  {k:'assist',label:'Assist',icon:'🅰️',col:'A'},
  {k:'shot_on',label:'Shot on target',icon:'🎯',col:'SoT'},
  {k:'shot_off',label:'Shot off target',icon:'↗️',col:'Off'},
  {k:'save',label:'Save',icon:'🧤',col:'Sv'},
  {k:'tackle',label:'Tackle',icon:'🦵',col:'Tk'},
  {k:'interception',label:'Interception',icon:'✋',col:'Int'},
  {k:'keypass',label:'Key pass',icon:'🔑',col:'KP'},
  {k:'block',label:'Block',icon:'🛡️',col:'Blk'},
  {k:'dribble',label:'Beat a player',icon:'💨',col:'Drb'},
  {k:'yellow',label:'Yellow card',icon:'🟨',col:'YC'}
];
const STAT=Object.fromEntries(STAT_DEFS.map(s=>[s.k,s]));
const DEFAULT_SETTINGS={teamName:'Estrella',halfLen:35,stats:['goal','assist','shot_on','shot_off','save','tackle']};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function deepMerge(t,s){for(const k of Object.keys(s)){if(isObj(s[k])&&isObj(t[k]))deepMerge(t[k],s[k]);else t[k]=isObj(s[k])?clone(s[k]):s[k];}return t;}
function strip(o){const c=clone(o);delete c.id;return c;}

let S={players:{},matches:{},settings:clone(DEFAULT_SETTINGS)};
let ui={tab:'matches',view:'matches',id:null,season:'all',sort:'goal',showArchived:false};
let lastUndo=null,confirmFn=null,deferRender=false,toastTimer=null;

/* ---------- mode: local or firebase ---------- */
let fbCfg=null,FS=null,FA=null,fdb=null,auth=null,user=null,authReady=false,fbFailed=false;
let unsubs=[];const meta={};
function loadCfg(){try{fbCfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null');}catch(e){fbCfg=null;}}
const team=()=>!!(fbCfg&&!fbFailed);
const canWrite=()=>!team()||!!user;

function loadLocal(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);
  if(d.S){S.players=d.S.players||{};S.matches=d.S.matches||{};S.settings=Object.assign(clone(DEFAULT_SETTINGS),d.S.settings||{});}
  if(d.ui)ui=Object.assign(ui,d.ui);}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({S,ui}))}catch(e){}}

/* ---------- write operations (apply locally, then send to team database) ---------- */
function fsRef(path){return FS.doc(fdb,...path.split('/'));}
function fsDo(p){if(p&&p.catch)p.catch(onFsErr);}
const remote=()=>team()&&user&&FS&&fdb;
const store={
  setPlayer(p){p.updatedAt=Date.now();S.players[p.id]=p;persist();if(remote())fsDo(FS.setDoc(fsRef('players/'+p.id),strip(p)));updateSync();},
  setMatch(m){m.updatedAt=Date.now();S.matches[m.id]=m;persist();if(remote())fsDo(FS.setDoc(fsRef('matches/'+m.id),strip(m)));updateSync();},
  patchMatch(m,fields){fields.updatedAt=Date.now();deepMerge(m,fields);persist();if(remote())fsDo(FS.setDoc(fsRef('matches/'+m.id),clone(fields),{merge:true}));updateSync();},
  addEvents(m,evs){m.events=m.events||[];m.events.push(...evs);m.updatedAt=Date.now();persist();
    if(remote())fsDo(FS.setDoc(fsRef('matches/'+m.id),{events:FS.arrayUnion(...clone(evs)),updatedAt:m.updatedAt},{merge:true}));updateSync();},
  removeEvents(m,evs){if(!evs.length)return;const ids=new Set(evs.map(e=>e.id));m.events=(m.events||[]).filter(e=>!ids.has(e.id));m.updatedAt=Date.now();persist();
    if(remote())fsDo(FS.setDoc(fsRef('matches/'+m.id),{events:FS.arrayRemove(...clone(evs)),updatedAt:m.updatedAt},{merge:true}));updateSync();},
  deleteMatch(id){delete S.matches[id];persist();if(remote())fsDo(FS.deleteDoc(fsRef('matches/'+id)));updateSync();},
  patchSettings(fields){fields.updatedAt=Date.now();deepMerge(S.settings,fields);persist();if(remote())fsDo(FS.setDoc(fsRef('settings/main'),clone(fields),{merge:true}));updateSync();}
};
function onFsErr(e){const code=e&&e.code||'';
  if(code.includes('permission-denied'))showBanner('Your account isn’t on the team list yet. Ask the team admin to add your email to the database rules.');
  else console.warn(e);}

/* ---------- firebase ---------- */
async function initFirebase(){
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  try{
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    FA=authM;FS=fsM;
    const app=appM.initializeApp(fbCfg);
    auth=authM.getAuth(app);
    try{fdb=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})});}
    catch(e){fdb=fsM.getFirestore(app);}
    authM.onAuthStateChanged(auth,u=>{user=u;authReady=true;if(u)startListeners();else stopListeners();render();updateSync();});
  }catch(e){
    console.warn(e);fbFailed=true;authReady=true;
    showBanner('Can’t reach the team database right now. Connect to the internet once so the app can finish setting up – until then, changes stay on this phone only.');
    render();updateSync();
  }
}
function startListeners(){stopListeners();const o={includeMetadataChanges:true};
  const err=e=>{onFsErr(e);};
  unsubs.push(FS.onSnapshot(FS.collection(fdb,'players'),o,snap=>{const r={};snap.forEach(d=>{r[d.id]=Object.assign(d.data(),{id:d.id});});S.players=r;meta.p=snap.metadata;afterRemote();},err));
  unsubs.push(FS.onSnapshot(FS.collection(fdb,'matches'),o,snap=>{const r={};snap.forEach(d=>{const m=Object.assign(d.data(),{id:d.id});m.events=m.events||[];r[d.id]=m;});S.matches=r;meta.m=snap.metadata;afterRemote();},err));
  unsubs.push(FS.onSnapshot(FS.doc(fdb,'settings','main'),o,snap=>{S.settings=Object.assign(clone(DEFAULT_SETTINGS),snap.exists()?snap.data():{});meta.s=snap.metadata;afterRemote();},err));
}
function stopListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];}
function afterRemote(){persist();rerender();updateSync();}

function updateSync(){const el=$('#sync');let t;
  if(!team())t=fbCfg&&fbFailed?'📱 Phone only (not synced)':'📱 On this phone';
  else if(!user)t=authReady?'Not signed in':'Connecting…';
  else{const ms=Object.values(meta);const pending=ms.some(x=>x&&x.hasPendingWrites);const cached=ms.some(x=>x&&x.fromCache)||!navigator.onLine;
    t=pending?(cached?'📱 Saved – will sync':'⏳ Syncing…'):(cached?'📶 Offline':'✓ Synced');}
  el.textContent=t;}
window.addEventListener('online',updateSync);window.addEventListener('offline',updateSync);
function showBanner(msg){const b=$('#banner');b.textContent=msg;b.classList.remove('hidden');}
function hideBanner(){$('#banner').classList.add('hidden');}

function parseConfig(txt){txt=String(txt||'').trim();if(!txt)return null;
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)return null;
  let s=txt.slice(a,b+1);
  try{return JSON.parse(s);}catch(e){}
  s=s.replace(/\/\/[^\n]*/g,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');
  try{return JSON.parse(s);}catch(e){return null;}}
function validCfg(c){return c&&c.apiKey&&c.projectId&&c.appId&&c.authDomain;}
function setupLink(){return location.origin+location.pathname+'#setup='+btoa(unescape(encodeURIComponent(JSON.stringify(fbCfg))));}
function connect(cfg){
  if(Object.keys(S.players).length||Object.keys(S.matches).length){try{localStorage.setItem(PRE_KEY,JSON.stringify({players:S.players,matches:S.matches,settings:S.settings}));}catch(e){}}
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));S={players:{},matches:{},settings:clone(DEFAULT_SETTINGS)};persist();location.reload();}
function disconnect(){askConfirm('Disconnect this phone from the team database? The team’s data stays safe online.','Disconnect',async()=>{
  try{if(auth&&FA)await FA.signOut(auth);}catch(e){}
  localStorage.removeItem(CFG_KEY);S={players:{},matches:{},settings:clone(DEFAULT_SETTINGS)};persist();location.reload();});}

/* ---------- helpers ---------- */
function playersSorted(all){return Object.values(S.players).filter(p=>all||p.active!==false)
  .sort((a,b)=>numVal(a)-numVal(b)||String(a.name).localeCompare(String(b.name)));}
function numVal(p){const n=parseInt(p&&p.number,10);return isNaN(n)?999:n;}
function pname(pid){const p=S.players[pid];if(!p)return'(removed)';const parts=String(p.name).trim().split(/\s+/);const f=parts[0];
  const clash=Object.values(S.players).some(q=>q.id!==p.id&&String(q.name).trim().split(/\s+/)[0].toLowerCase()===f.toLowerCase());
  return clash&&parts.length>1?f+' '+parts[parts.length-1][0]:f;}
function numTxt(p){return p&&p.number!=null&&p.number!==''?p.number:'–';}
function badge(pid){return `<span class="num">${esc(numTxt(S.players[pid]))}</span>`;}
function fmtDate(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function mmss(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function minuteOf(t){return (Math.floor(t/60)+1)+'′';}
function seasonOf(d){if(!d)return'?';const y=+d.slice(0,4),m=+d.slice(5,7);const s=m>=7?y:y-1;return s+'/'+String((s+1)%100).padStart(2,'0');}
function enabledStats(){return (S.settings.stats||[]).filter(k=>STAT[k]);}
function clockNow(m){const c=m.clock||{};return (c.base||0)+(c.running&&c.startedAt?Math.max(0,(Date.now()-c.startedAt)/1000):0);}
function evSorted(m){return (m.events||[]).slice().sort((a,b)=>a.t-b.t||(a.at||0)-(b.at||0));}
function onPitch(m){const st={};for(const e of evSorted(m)){if(e.type==='on')st[e.pid]=true;else if(e.type==='off')st[e.pid]=false;}
  return Object.keys(st).filter(k=>st[k]).sort((a,b)=>numVal(S.players[a])-numVal(S.players[b]));}
function secsPlayed(m,pid,tEnd){let on=null,tot=0;for(const e of evSorted(m)){if(e.pid!==pid)continue;
  if(e.type==='on'&&on===null)on=e.t;else if(e.type==='off'&&on!==null){tot+=Math.max(0,e.t-on);on=null;}}
  if(on!==null)tot+=Math.max(0,tEnd-on);return tot;}
function endT(m){return (m.status==='done'||m.period==='FT')&&m.endT!=null?m.endT:clockNow(m);}
function score(m){let us=0,them=0;for(const e of m.events||[]){if(e.type==='goal')us++;else if(e.type==='opp_goal')them++;}return [us,them];}
function resultOf(m){const [a,b]=score(m);return a>b?'W':a<b?'L':'D';}
function count(m,pid,k){return (m.events||[]).filter(e=>e.pid===pid&&e.type===k).length;}
function cur(){return ui.id?S.matches[ui.id]:null;}
function mkEvent(m,type,pid,extra){const e={id:uid(),t:Math.round(clockNow(m)),type,pid:pid||null,at:Date.now()};if(extra)Object.assign(e,extra);return e;}
function addEvent(m,type,pid,extra){const e=mkEvent(m,type,pid,extra);store.addEvents(m,[e]);return e;}
function periodLabel(m){return {pre:'Pre-match',1:'1st half',HT:'Half time',2:'2nd half',FT:'Full time'}[m.period]||'';}
function stopClock(m){return {running:false,base:clockNow(m),startedAt:null};}

/* ---------- render ---------- */
function rerender(){const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){deferRender=true;return;}render();}
document.addEventListener('focusout',()=>{if(deferRender){deferRender=false;setTimeout(render,0);}});
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  $('#teamName').textContent=S.settings.teamName||'Match Stats';
  document.title=(S.settings.teamName||'Team')+' Match Stats';
  if(team()&&!user){$('#nav').classList.add('hidden');$('#view').innerHTML=authReady?viewSignIn():`<div class="card empty"><div class="big">⏳</div><p class="muted">Connecting to the team database…</p></div>`;return;}
  $('#nav').classList.remove('hidden');
  let m=cur();
  if(['setup','live','summary'].includes(ui.view)&&!m){ui.view='matches';ui.id=null;}
  let h='';
  switch(ui.view){
    case 'setup':h=viewSetup(m);break;
    case 'live':h=viewLive(m);break;
    case 'summary':h=viewSummary(m);break;
    case 'squad':h=viewSquad();break;
    case 'stats':h=viewStats();break;
    case 'settings':h=viewSettings();break;

function evText(e){
  if(e.type==='opp_goal')return '⚽ <b>Opposition goal</b>';

  if(e.type==='off')return '🔽 <b>'+esc(pname(e.pid))+'</b> off';
  const s=STAT[e.type];return (s?s.icon+' '+esc(s.label):esc(e.type))+' – <b>'+esc(pname(e.pid))+'</b>';
}
function goalsList(m){const g=evSorted(m).filter(e=>e.type==='goal');const by={};const order=[];
  for(const e of g){const k=e.pid||'_';if(!by[k]){by[k]=[];order.push(k);}by[k].push(minuteOf(e.t));}
  return order.map(k=>({name:k==='_'?'Own goal / unknown':pname(k),mins:by[k]}));}

function aggregate(matches){
  const rows={};let total=0;
  const row=pid=>rows[pid]||(rows[pid]={pid,apps:0,starts:0,sec:0,potm:0,st:{}});
  for(const p of playersSorted())row(p.id);
  for(const m of matches){const te=endT(m);total+=te;const pids=new Set();
    Object.keys(m.squad||{}).forEach(p=>pids.add(p));(m.events||[]).forEach(e=>e.pid&&pids.add(e.pid));
    for(const pid of pids){const sec=secsPlayed(m,pid,te),started=(m.squad||{})[pid]==='start';const r=row(pid);
      if(sec>0||started)r.apps++;if(started)r.starts++;r.sec+=sec;if(m.potm===pid)r.potm++;}
    for(const e of m.events||[])if(e.pid&&STAT[e.type]){const r=row(e.pid);r.st[e.type]=(r.st[e.type]||0)+1;}
  }
  return {rows:Object.values(rows),total};
}
function statsMatches(){return Object.values(S.matches).filter(m=>m.status==='done'&&(ui.season==='all'||seasonOf(m.date)===ui.season));}
function sortedRows(agg){const k=ui.sort;const v=r=>k==='apps'?r.apps:k==='starts'?r.starts:k==='mins'||k==='pct'?r.sec:k==='potm'?r.potm:(r.st[k]||0);
  return agg.rows.slice().sort((a,b)=>k==='name'?String(pname(a.pid)).localeCompare(pname(b.pid)):(v(b)-v(a))||(b.sec-a.sec)||String(pname(a.pid)).localeCompare(pname(b.pid)));}

function viewStats(){
  const seasons=[...new Set(Object.values(S.matches).filter(m=>m.status==='done').map(m=>seasonOf(m.date)))].sort().reverse();
  if(ui.season!=='all'&&!seasons.includes(ui.season))ui.season='all';
  const ms=statsMatches();const agg=aggregate(ms);
  let w=0,d=0,l=0,gf=0,ga=0;ms.forEach(m=>{const [a,b]=score(m);gf+=a;ga+=b;a>b?w++:a<b?l++:d++;});
  let h=`<div class="card"><div class="row"><h2 class="grow" style="margin:0">Season stats</h2><select data-season="1" style="width:auto">${['all'].concat(seasons).map(s=>`<option value="${esc(s)}" ${ui.season===s?'selected':''}>${s==='all'?'All matches':esc(s)}</option>`).join('')}</select></div>
  <div class="stat-row" style="margin-top:12px"><div><b>${ms.length}</b><span>Played</span></div><div><b>${w}-${d}-${l}</b><span>W-D-L</span></div><div><b>${gf}</b><span>Scored</span></div><div><b>${ga}</b><span>Conceded</span></div></div></div>`;
  if(!ms.length)return h+`<p class="muted" style="text-align:center">Stats appear here once you’ve saved a match.</p>`;
  const cols=enabledStats();
  const th=(k,lab)=>`<th class="${ui.sort===k?'on':''}" data-act="sortBy" data-k="${k}">${lab}${ui.sort===k?' ▾':''}</th>`;
  h+=`<div class="card"><div class="muted small" style="margin-bottom:6px">Tap a heading to sort. <b>%</b> = share of total match time played.</div><div class="tablewrap"><table><tr>${th('name','Player')}${th('apps','Apps')}${th('starts','St')}${th('mins','Mins')}${th('pct','%')}${cols.map(k=>th(k,STAT[k].col)).join('')}${th('potm','⭐')}</tr>`;
  for(const r of sortedRows(agg)){const pct=agg.total?Math.round(r.sec/agg.total*100):0;
    h+=`<tr><td>${esc(pname(r.pid))}</td><td>${r.apps}</td><td>${r.starts}</td><td>${Math.round(r.sec/60)}</td><td>${pct}</td>${cols.map(k=>`<td>${r.st[k]||'<span class="muted">·</span>'}</td>`).join('')}<td>${r.potm||'<span class="muted">·</span>'}</td></tr>`;}
  h+=`</table></div><div class="muted small" style="margin-top:8px">${cols.map(k=>STAT[k].col+' = '+STAT[k].label).join(' · ')} · St = starts</div></div>
  <div class="btns"><button class="btn pri" data-act="dlCsv">⬇ Download CSV</button><button class="btn" data-act="copyCsv">📋 Copy for Excel</button></div>`;
  return h;
}
function statsCsv(){const ms=statsMatches(),agg=aggregate(ms),cols=enabledStats();
  const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[['Player','Number','Apps','Starts','Minutes','% time'].concat(cols.map(k=>STAT[k].label),['POTM']).map(q).join(',')];
  for(const r of sortedRows(agg)){const p=S.players[r.pid]||{};lines.push([p.name||pname(r.pid),p.number==null?'':p.number,r.apps,r.starts,Math.round(r.sec/60),agg.total?Math.round(r.sec/agg.total*100):0].concat(cols.map(k=>r.st[k]||0),[r.potm]).map(q).join(','));}
  return lines.join('\n');}

  <p class="muted small" style="text-align:center">Match Stats v${APP_VERSION}</p>`;
  return h;
}

/* ---------- setup guide ---------- */
function rulesText(emails){
  const list=emails.split(/[\s,;]+/).map(e=>e.trim().toLowerCase()).filter(e=>/@/.test(e));
  const arr=list.length?list.map(e=>`'${e.replace(/'/g,'')}'`).join(',\n          '):"'you@example.com'";
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if request.auth != null
        && request.auth.token.email in [
          ${arr}
        ];
    }
  }
}`;}
function guideHtml(){
  return `<div class="row"><h2 class="grow" style="margin:0">Set up a team database</h2><button class="x" data-act="closeSheet">✕</button></div>

   <li>Left menu → <b>Build → Firestore Database → Create database</b>. Location: <b>europe-west2 (London)</b>. Choose <b>production mode</b>.</li>
   <li>Left menu → <b>Build → Authentication → Get started</b>. Pick <b>Email/Password</b>, switch it on, Save. Then on the <b>Users</b> tab, <b>Add user</b> for yourself and each coach (their email + a password you give them).</li>

     <label class="f">Coach emails (one per line)</label><textarea id="ruleEmails" class="code" style="min-height:80px" placeholder="you@example.com&#10;coach@example.com"></textarea>
     <button class="btn block" style="margin-top:8px" data-act="copyRules">📋 Copy rules</button></li>
   <li>Click the ⚙️ next to <b>Project overview → Project settings</b>. Under <b>Your apps</b> click the <b>&lt;/&gt;</b> (web) icon, give it a name, skip hosting, and click <b>Register app</b>. Copy the block of code that starts <code>const firebaseConfig = {</code>.</li>
   <li>Paste it here and tap Connect:

/* ---------- sheet / toast ---------- */
function openSheet(h){$('#sheet').innerHTML=h;$('#sheetWrap').classList.remove('hidden');$('#sheet').scrollTop=0;}
function closeSheet(){$('#sheetWrap').classList.add('hidden');$('#sheet').innerHTML='';}
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet();});
function toast(msg,undo){const t=$('#toast');lastUndo=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;t.classList.remove('hidden');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.add('hidden');lastUndo=null;},undo?5000:2400);}
function askConfirm(msg,yesLabel,fn){confirmFn=fn;openSheet(`<h2>${esc(msg)}</h2><div class="btns"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="confirmYes">${esc(yesLabel)}</button></div>`);}
async function copyText(txt,label){try{await navigator.clipboard.writeText(txt);toast((label||'Copied')+' ✓');}
  catch(e){openSheet(`<h2>Copy this</h2><p class="muted small">Press and hold in the box, then Select all → Copy.</p><textarea readonly class="code" style="min-height:220px">${esc(txt)}</textarea><button class="btn block" style="margin-top:8px" data-act="closeSheet">Done</button>`);}}
function download(filename,text,mime){try{const blob=new Blob([text],{type:mime||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('Downloaded ✓');}catch(e){copyText(text);}}
function backupJson(){return JSON.stringify({v:1,players:S.players,matches:S.matches,settings:S.settings});}

/* ---------- player sheets ---------- */
function sheetHead(m,pid){const p=S.players[pid]||{};return `<div class="row" style="margin-bottom:12px">${badge(pid)}<div class="grow"><div style="font-weight:800;font-size:18px">${esc(p.name||'(removed)')}</div><div class="muted small">${mmss(secsPlayed(m,pid,clockNow(m)))} played</div></div><button class="x" data-act="closeSheet">✕</button></div>`;}
function playerPick(pids,act,extraAttr){return `<div class="tiles">${pids.map(pid=>`<button class="tile" data-act="${act}" data-pid="${esc(pid)}" ${extraAttr||''}><div class="n">${esc(numTxt(S.players[pid]))}</div><div class="nm">${esc(pname(pid))}</div></button>`).join('')}</div>`;}

  tapBench(d){const m=cur();

  delEv(d){const m=cur();const ev=(m.events||[]).find(e=>e.id===d.eid);if(!ev)return;

  undo(){if(!lastUndo)return;const m=S.matches[lastUndo.mid];if(m){const ids=new Set(lastUndo.eids);store.removeEvents(m,m.events.filter(e=>ids.has(e.id)||ids.has(e.link)));render();}

  shareReport(){const m=cur();const [a,b]=score(m);const tm=S.settings.teamName||'Us';

    const gl=goalsList(m);if(gl.length)t+=`\n⚽ Goals: ${gl.map(g=>g.name+(g.mins.length>1?' ×'+g.mins.length:'')).join(', ')}`;

    const al=Object.keys(as);if(al.length)t+=`\n🅰️ Assists: ${al.map(p=>pname(p)+(as[p]>1?' ×'+as[p]:'')).join(', ')}`;
    const sv={};(m.events||[]).filter(e=>e.type==='save').forEach(e=>{sv[e.pid]=(sv[e.pid]||0)+1;});
    if(Object.keys(sv).length)t+=`\n🧤 Saves: ${Object.keys(sv).map(p=>pname(p)+' '+sv[p]).join(', ')}`;
    if(m.potm)t+=`\n⭐ Player of the Match: ${pname(m.potm)}`;
    if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyText(t,'Report copied');},
  sortBy(d){ui.sort=d.k;render();},
  dlCsv(){download(`${(S.settings.teamName||'team').replace(/[^\w-]+/g,'_')}_stats_${ui.season==='all'?'all':ui.season.replace('/','-')}.csv`,statsCsv(),'text/csv');},
  copyCsv(){copyText(statsCsv(),'Copied – paste into Excel');},
  dlBackup(){download(`match-stats-backup-${today()}.json`,backupJson(),'application/json');},
  copyBackup(){copyText(backupJson(),'Backup copied');},
  editPlayer(d){const p=S.players[d.pid];if(!p)return;
    openSheet(`<div class="row"><h2 class="grow" style="margin:0">Edit player</h2><button class="x" data-act="closeSheet">✕</button></div>
    <form data-form="savePlayer" data-pid="${esc(p.id)}"><div class="row"><div style="width:80px"><label class="f">No.</label><input name="num" inputmode="numeric" value="${esc(p.number==null?'':p.number)}"></div><div class="grow"><label class="f">Name</label><input name="name" value="${esc(p.name)}"></div></div>

  rulesHelp(){openSheet(`<div class="row"><h2 class="grow" style="margin:0">Add a coach</h2><button class="x" data-act="closeSheet">✕</button></div>

    <p class="muted small">Easiest: just open the setup link you were sent. Or paste the link or the Firebase config here.</p><textarea id="cfgBox" class="code"></textarea><button class="btn pri block" style="margin-top:8px" data-act="connectCfg">Connect</button>`);},
  connectCfg(){const v=($('#cfgBox')||{}).value||'';let cfg=null;const mh=v.match(/#setup=([A-Za-z0-9+/=_-]+)/);
    if(mh){try{cfg=JSON.parse(decodeURIComponent(escape(atob(mh[1]))));}catch(e){}}else cfg=parseConfig(v);

  uploadPre(){let pre=null;try{pre=JSON.parse(localStorage.getItem(PRE_KEY)||'null');}catch(e){}if(!pre)return;

function importData(d){let c=0;
  for(const [id,p] of Object.entries(d.players||{})){if(p&&p.name){store.setPlayer(Object.assign({},p,{id}));c++;}}
  for(const [id,m] of Object.entries(d.matches||{})){if(m&&Array.isArray(m.events)){const mm=Object.assign({},m,{id});if(mm.endT===undefined)mm.endT=null;store.setMatch(mm);c++;}}
  if(d.settings){const s=clone(d.settings);delete s.updatedAt;store.patchSettings(s);}
  return c;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;e.preventDefault();
  const ro=['newMatch','setVenue','setSq','confirmSetup','editLineup','kickoff','pause','resume','halftime','secondHalf','back2nd','setPotm','finish','reopen','addStat','addAssist','goalUnknown','oppGoal','subOff','subSwap','subOn','archivePlayer','restorePlayer'];
  if(!canWrite()&&ro.includes(el.dataset.act))return toast('Sign in first');
  fn(el.dataset,el);});

function addPlayer(name,num){name=String(name||'').trim();if(!name)return null;const id=uid();
  const n=String(num==null?'':num).trim();store.setPlayer({id,name,number:n===''?null:n,active:true,createdAt:Date.now()});return id;}
function parseLine(line){line=line.trim().replace(/^[-•*]\s*/,'');if(!line)return null;let m;
  if((m=line.match(/^#?(\d{1,3})[\s.\-:)]+(.+)$/)))return {num:m[1],name:m[2].trim()};
  if((m=line.match(/^(.+?)[\s,\-]+#?(\d{1,3})$/)))return {num:m[2],name:m[1].trim()};
  return {num:'',name:line};}
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='signIn'){const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';
    FA.signInWithEmailAndPassword(auth,f.email.value.trim(),f.pw.value).then(()=>{hideBanner();}).catch(err=>{btn.disabled=false;btn.textContent='Sign in';
      const c=err&&err.code||'';toast(c.includes('network')?'No signal – try again when connected':'Wrong email or password');});return;}
  if(!canWrite())return toast('Sign in first');
  if(k==='addPlayer'){const n=f.name.value;if(!n.trim())return toast('Type a name');addPlayer(n,f.num.value);render();toast(n.trim()+' added');setTimeout(()=>{const i=document.querySelector('form[data-form="addPlayer"] input[name="num"]');if(i)i.focus();},50);}
  else if(k==='bulkAdd'){const lines=f.list.value.split(/\n/).map(parseLine).filter(Boolean);lines.forEach(l=>addPlayer(l.name,l.num));render();toast(lines.length+' players added');}
  else if(k==='savePlayer'){const p=S.players[f.dataset.pid];if(!p)return;const n=f.name.value.trim();if(!n)return toast('Name can’t be blank');p.name=n;const num=f.num.value.trim();p.number=num===''?null:num;store.setPlayer(p);closeSheet();render();}
  else if(k==='restore'){let d;try{d=JSON.parse(f.json.value);}catch(err){return toast('That doesn’t look like a backup');}
    askConfirm('Add everything from this backup?','Restore',()=>{const c=importData(d);closeSheet();render();toast('Restored '+c+' items');});}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.season){ui.season=el.value;render();return;}
  if(!canWrite())return;
  if(el.dataset.mf){const m=cur();if(!m)return;let v=el.value;const f=el.dataset.mf;if(f==='halfLen')v=Math.max(1,parseInt(v,10)||35);if(f==='opponent')v=v.trim();store.patchMatch(m,{[f]:v});}
  else if(el.dataset.sf){let v=el.value;if(el.dataset.sf==='halfLen')v=Math.max(1,parseInt(v,10)||35);else v=v.trim();store.patchSettings({[el.dataset.sf]:v});$('#teamName').textContent=S.settings.teamName||'Match Stats';}
  else if(el.dataset.statk){const set=new Set(enabledStats());el.checked?set.add(el.dataset.statk):set.delete(el.dataset.statk);
    store.patchSettings({stats:STAT_DEFS.map(s=>s.k).filter(k=>set.has(k))});}
});

(function handleSetupHash(){const h=location.hash||'';if(!h.startsWith('#setup='))return;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  try{const cfg=JSON.parse(decodeURIComponent(escape(atob(h.slice(7)))));
    if(validCfg(cfg)&&(!fbCfg||fbCfg.projectId!==cfg.projectId)){
      if(!fbCfg&&(Object.keys(S.players).length||Object.keys(S.matches).length)){try{localStorage.setItem(PRE_KEY,JSON.stringify({players:S.players,matches:S.matches,settings:S.settings}));}catch(e){}}
      localStorage.setItem(CFG_KEY,JSON.stringify(cfg));fbCfg=cfg;S={players:{},matches:{},settings:clone(DEFAULT_SETTINGS)};persist();}
  }catch(e){}})();
